# Docker Compose файл для hw2.
#
# Имя образа для back/front собирается из переменных DOCKERHUB_USERNAME и IMAGE_TAG —
# их compose берёт из .env.development.compose, который мы передаём флагом --env-file
# (см. Makefile).
#
# В этом файле НИГДЕ не должно быть сборки из исходников: образы должны браться
# готовыми с Docker Hub. Если потребуется собрать — это делает Makefile, не compose.
name: todo-app
services:
  db:
    image: postgres:16-alpine
    env_file:
      .env.development.db
    restart: unless-stopped
    ports:
        - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    # TODO — база данных:
    #   - указать готовый образ postgres 16-alpine
    #   - подать переменные окружения из соответствующего env-файла
    #   - пробросить порт наружу на 15432 (внешний выбран так, чтобы не конфликтовать
    #     с локально установленным Postgres)
    #   - персистить данные через NAMED VOLUME (не bind-mount); имя тома — pgdata
    #   - добавить проверку готовности: запрос к самой БД через pg_isready,
    #     с использованием POSTGRES_USER и POSTGRES_DB
    #     ⚠️ переменные окружения внутри проверки экранируются двойным $$,
    #     иначе compose попытается подставить их сам на этапе парсинга файла
    #     (а нам надо, чтобы их разворачивал shell внутри контейнера в рантайме)
    #   - подобрать осмысленные параметры проверки: как часто опрашивать, сколько
    #     попыток до признания unhealthy, сколько ждать перед самой первой проверкой

  back:
    image: ${DOCKERHUB_USERNAME}/todo-back:${APP_VERSION}
    platform: linux/amd64
    env_file: .env.development.back
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION}
    ports:
      - "13000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app-config:/app/config:ro

    # TODO — backend (NestJS):
    #   - указать образ, который ты публикуешь в свой Docker Hub репозиторий
    #     (используй переменные DOCKERHUB_USERNAME и IMAGE_TAG)
    #   - указать платформу образа linux/amd64 (см. раздел «Платформа» в задании —
    #     на Apple Silicon без этого compose pull запросит arm64-манифест и упадёт,
    #     потому что мы публикуем single-arch amd64-образы)
    #   - подать переменные окружения из соответствующего env-файла
    #     (не забудь: в нём DB_HOST теперь смотрит на service-name из compose-сети)
    #   - пробросить порт API на 13000
    #   - выразить зависимость от базы: back не должен стартовать, пока БД не
    #     ответит на healthcheck успешно (используй подходящую condition)
    #   - примонтировать локальную папку с runtime-конфигом внутрь контейнера
    #     по пути /app/config; делаем это READ-ONLY, чтобы контейнер физически
    #     не мог изменить файл на хосте

  front:
    image: ${DOCKERHUB_USERNAME}/todo-front:${APP_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      back:
        condition: service_started

    # TODO — frontend (nginx со статикой):
    #   - указать образ из своего Docker Hub репозитория
    #   - указать платформу образа linux/amd64 (по той же причине, что у back)
    #   - пробросить 80-й порт nginx наружу на 18080
    #   - выразить зависимость от back, но НЕ через service_healthy:
    #     у back в этом задании нет healthcheck, поэтому здесь нужна другая condition
    #     (которая ждёт только запуска контейнера, не его health-статуса)

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    pid: host                          # доступ к PID-пространству хоста
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'   # хранить данные 15 дней
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
  # TODO — секция named volumes:
  #   - объявить том, имя которого ты указал в сервисе db (без дополнительных опций,
  #     пустого тела достаточно)
