apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: zhulinnikolai/todo-back:latest
      ports:
        - containerPort: 3000
      env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "myapp_user"
        - name: DB_PASSWORD
          value: "change_me_please"
        - name: DB_NAME
          value: "myapp"