apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  imagePullSecrets:
    - name: dockerhub-cred
  containers:
    - name: backend
      image: zhulinnikolai/back:latest
      ports:
        - containerPort: 3000
      envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP