name: Deploy

#on:
#  push:
#    branches: [week*]

on:
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ back, front ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build и push образа с двумя тегами
        env:
          IMAGE_SHA: ${{ vars.DOCKER_USER }}/todo-${{ matrix.service }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ vars.DOCKER_USER }}/todo-${{ matrix.service }}:latest
        run: |
          if [ "${{ matrix.service }}" = "front" ]; then
            source .env.development.front
            docker build \
              --build-arg "VITE_API_URL=$VITE_API_URL" \
              -t "$IMAGE_SHA" \
              -t "$IMAGE_LATEST" \
              ./front
          else
            docker build \
              -t "$IMAGE_SHA" \
              -t "$IMAGE_LATEST" \
              ./back 
          fi
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/myapp
            export APP_VERSION=sha-${{ github.sha }}
            docker compose \
              --env-file .env.development.compose \
              pull back front
            docker compose \
              --env-file .env.development.compose \
              up -d --no-deps back front

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        env:
          E2E_BASE_URL: ${{ vars.VITE_API_URL }}
        run: |
          # vars.VITE_API_URL у нас вида https://домен/api → отрежем /api
          export E2E_BASE_URL="${E2E_BASE_URL%/api}"
          bash scripts/smoke.sh

  deploy-monitoring:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy monitoring configs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "monitoring"
          target: "/home/deploy/myapp"

      - name: Restart monitoring
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/myapp

            docker compose \
              --env-file .env.development.compose \
              up -d --no-deps --force-recreate prometheus grafana  
      
  notify:
    needs: [ checks, build, deploy, verify ]
    if: always()
    uses: ./.github/workflows/notify.yaml
    with:
      checks_result: ${{ needs.checks.result }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      verify_result: ${{ needs.verify.result }}
    secrets: inherit